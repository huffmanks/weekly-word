    function init() {
      preloadTheme();
      onScroll();
      animate();
      updateThemeButtons();

      const backToTop = document.getElementById("back-to-top");
      backToTop?.addEventListener("click", (event) => scrollToTop(event));

      const backToPrev = document.getElementById("back-to-prev");
      backToPrev?.addEventListener("click", () => window.history.back());

      const lightThemeButton = document.getElementById("light-theme-button");
      lightThemeButton?.addEventListener("click", () => {
        localStorage.setItem("theme", "light");
        toggleTheme(false);
        updateThemeButtons();
      });

      const darkThemeButton = document.getElementById("dark-theme-button");
      darkThemeButton?.addEventListener("click", () => {
        localStorage.setItem("theme", "dark");
        toggleTheme(true);
        updateThemeButtons();
      });

      const systemThemeButton = document.getElementById("system-theme-button");
      systemThemeButton?.addEventListener("click", () => {
        localStorage.setItem("theme", "system");
        toggleTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
        updateThemeButtons();
      });

      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (event) => {
        if (localStorage.theme === "system") {
          toggleTheme(event.matches);
        }
      });

      document.addEventListener("scroll", onScroll);
    }

    function updateThemeButtons() {
      const theme = localStorage.getItem("theme");
      const lightThemeButton = document.getElementById("light-theme-button");
      const darkThemeButton = document.getElementById("dark-theme-button");
      const systemThemeButton = document.getElementById("system-theme-button");

      function removeActiveButtonTheme(button) {
        button?.classList.remove("bg-neutral-300");
        button?.classList.remove("dark:bg-neutral-800");
      }

      function addActiveButtonTheme(button) {
        button?.classList.add("bg-neutral-300");
        button?.classList.add("dark:bg-neutral-800");
      }

      removeActiveButtonTheme(lightThemeButton);
      removeActiveButtonTheme(darkThemeButton);
      removeActiveButtonTheme(systemThemeButton);

      if (theme === "light") {
        addActiveButtonTheme(lightThemeButton);
      } else if (theme === "dark") {
        addActiveButtonTheme(darkThemeButton);
      } else {
        addActiveButtonTheme(systemThemeButton);
      }
    }

    function animate() {
      const animateElements = document.querySelectorAll(".animate");

      animateElements.forEach((element, index) => {
        setTimeout(() => {
          element.classList.add("show");
        }, index * 100);
      });
    }

    function onScroll() {
      if (window.scrollY > 0) {
        document.documentElement.classList.add("scrolled");
      } else {
        document.documentElement.classList.remove("scrolled");
      }
    }

    function scrollToTop(event) {
      event.preventDefault();
      window.scrollTo({
        top: 0,
        behavior: "smooth",
      });
    }

    function toggleTheme(dark) {
      const css = document.createElement("style");

      css.appendChild(
        document.createTextNode(
          `* {
             -webkit-transition: none !important;
             -moz-transition: none !important;
             -o-transition: none !important;
             -ms-transition: none !important;
             transition: none !important;
          }
        `
        )
      );

      document.head.appendChild(css);

      if (dark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      void window.getComputedStyle(css).opacity;
      document.head.removeChild(css);
    }

    function preloadTheme() {
      const userTheme = localStorage.theme;

      if (userTheme === "light" || userTheme === "dark") {
        toggleTheme(userTheme === "dark");
      } else {
        toggleTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
    }

    document.addEventListener("DOMContentLoaded", () => init());
    document.addEventListener("astro:after-swap", () => init());
    preloadTheme();

ine x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></button></div></div></div></footer><aside data-pagefind-ignore><div data-astro-transition-persist="astro-d2ubp4qq-2" id="backdrop" class="bg-[rgba(0, 0, 0, 0.5] invisible fixed top-0 left-0 z-50 flex h-screen w-full justify-center p-6 backdrop-blur-xs"><div id="pagefind-container" class="m-0 flex h-fit max-h-[80%] w-full max-w-(--breakpoint-sm) flex-col overflow-auto rounded-sm border border-neutral-300 bg-neutral-100 p-2 px-4 py-3 shadow-lg dark:border-neutral-700 dark:bg-neutral-900"><div id="search" class="pagefind-ui pagefind-init" data-pagefind-ui data-bundle-path="/pagefind/" data-ui-options="{&quot;showImages&quot;:false,&quot;excerptLength&quot;:15,&quot;resetStyles&quot;:false}"></div><script type="module" src="/_astro/Search.astro_astro_type_script_index_0_lang.DUyvCLDc.js"></script><div class="dark:prose-invert mr-2 pt-4 pb-1 text-right text-xs">Press <span class="prose dark:prose-invert text-xs"><kbd>Esc</kbd></span> or click anywhere to close</div></div></div></aside><script>
  const magnifyingGlass = document.getElementById("magnifying-glass");
  const backdrop = document.getElementById("backdrop");

  function openPagefind() {
    const searchDiv = document.getElementById("search");
    const search = searchDiv.querySelector("input");
    setTimeout(() => {
      search.focus();
    }, 0);
    backdrop?.classList.remove("invisible");
    backdrop?.classList.add("visible");
  }

  function closePagefind() {
    const search = document.getElementById("search");
    search.value = "";
    backdrop?.classList.remove("visible");
    backdrop?.classList.add("invisible");
  }

  magnifyingGlass?.addEventListener("click", () => {
    openPagefind();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/") {
      e.preventDefault();
      openPagefind();
    } else if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      e.preventDefault();
      openPagefind();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closePagefind();
    }
  });

  document.addEventListener("click", (event) => {
    if (event.target.classList.contains("pagefind-ui__result-link")) {
      closePagefind();
    }
  });

  backdrop?.addEventListener("click", (event) => {
    if (!event.target.closest("#pagefind-container")) {
      closePagefind();
    }
  });

  const form = document.getElementById("form");
  form?.addEventListener("submit", (event) => {
    event.preventDefault();
  });

  function makeResultsClickable() {
    const results = document.querySelectorAll(".pagefind-ui__result");
    results.forEach((result) => {
      const link = result.querySelector(".pagefind-ui__result-link");
      const excerpt = result.querySelector(".pagefind-ui__result-excerpt");

      if (!excerpt || excerpt.dataset.clickable) return;

      if (link) {
        excerpt.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          link.click();
        });
        excerpt.dataset.clickable = "true";
      }
    });
  }

  function initObserver() {
    const searchContainer = document.getElementById("search");
    if (searchContainer) {
      const observer = new MutationObserver(makeResultsClickable);
      observer.observe(searchContainer, { childList: true, subtree: true });
    }
  }

  document.addEventListener("DOMContentLoaded", initObserver);
  document.addEventListener("astro:after-swap", initObserver);
</script></body></html>
