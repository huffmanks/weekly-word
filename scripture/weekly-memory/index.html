    function updateThemeButtons() {

      const lightThemeButton = document.getElementById("light-theme-button");

      removeActiveButtonTheme(systemThemeButton);

      if (theme === "light") {

      e.preventDefault();
      openPagefind();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closePagefind();
    }
  });

  document.addEventListener("click", (event) => {
    if (event.target.classList.contains("pagefind-ui__result-link")) {
      closePagefind();
    }
  });

  backdrop?.addEventListener("click", (event) => {
    if (!event.target.closest("#pagefind-container")) {
      closePagefind();
    }
  });

  const form = document.getElementById("form");
  form?.addEventListener("submit", (event) => {
    event.preventDefault();
  });

  function makeResultsClickable() {
    const results = document.querySelectorAll(".pagefind-ui__result");
    results.forEach((result) => {
      const link = result.querySelector(".pagefind-ui__result-link");
      const excerpt = result.querySelector(".pagefind-ui__result-excerpt");

      if (!excerpt || excerpt.dataset.clickable) return;

      if (link) {
        excerpt.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          link.click();
        });
        excerpt.dataset.clickable = "true";
      }
    });
  }

  function initObserver() {
    const searchContainer = document.getElementById("search");
    if (searchContainer) {
      const observer = new MutationObserver(makeResultsClickable);
      observer.observe(searchContainer, { childList: true, subtree: true });
    }
  }

  document.addEventListener("DOMContentLoaded", initObserver);
  document.addEventListener("astro:after-swap", initObserver);

And saying, “The time is fulfilled, and God’s Kingdom is at hand! Repent, and believe in the Good News.”","bibleHref":"https://www.bible.com/bible/111/MRK.1.15.NIV","previousHref":"/scripture/weekly-memory/23","nextHref":"/scripture/weekly-memory/25"},{"id":25,"verses":"Luke 2:10-12","text":"The angel said to them, “Don’t be afraid, for behold, I bring you good news of great joy which will be to all the people. For there is born to you today, in David’s city, a Savior, who is Christ the Lord. This is the sign to you: you will find a baby wrapped in strips of cloth, lying in a feeding trough.”","bibleHref":"https://www.bible.com/bible/111/LUK.2.10-12.NIV","previousHref":"/scripture/weekly-memory/24","nextHref":"/scripture/weekly-memory/26"},{"id":26,"verses":"John 1:14","text":"The Word became flesh, and lived among us. We saw his glory, such glory as of the one and only Son of the Father, full of grace and truth.","bibleHref":"https://www.bible.com/bible/111/JHN.1.14.NIV","previousHref":"/scripture/weekly-memory/25","nextHref":"/scripture/weekly-memory/27"},{"id":27,"verses":"John 3:16-17","text":"For God so loved the world, that he gave his one and only Son, that whoever believes in him should not perish, but have eternal life. For God didn’t send his Son into the world to judge the world, but that the world should be saved through him.","bibleHref":"https://www.bible.com/bible/111/JHN.3.16-17.NIV","previousHref":"/scripture/weekly-memory/26","nextHref":"/scripture/weekly-memory/28"},{"id":28,"verses":"John 6:35","text":"Jesus said to them, “I am the bread of life. He who comes to me will not be hungry, and he who believes in me will never be thirsty.","bibleHref":"https://www.bible.com/bible/111/JHN.6.35.NIV","previousHref":"/scripture/weekly-memory/27","nextHref":"/scripture/weekly-memory/29"},{"id":29,"verses":"John 8:12","text":"Again, therefore, Jesus spoke to them, saying, “I am the light of the world. He who follows me will not walk in the darkness, but will
