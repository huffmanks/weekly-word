    function init() {

      const backToTop = document.getElementById("back-to-top");

      document.addEventListener("scroll", onScroll);

    function updateThemeButtons() {
      const theme = localStorage.getItem("theme");
      const lightThemeButton = document.getElementById("light-theme-button");
      const darkThemeButton = document.getElementById("dark-theme-button");
      const systemThemeButton = document.getElementById("system-theme-button");

      function removeActiveButtonTheme(button) {
        button?.classList.remove("bg-neutral-300");
        button?.classList.remove("dark:bg-neutral-800");
      }

      function addActiveButtonTheme(button) {
        button?.classList.add("bg-neutral-300");
        button?.classList.add("dark:bg-neutral-800");
      }

      removeActiveButtonTheme(lightThemeButton);
      removeActiveButtonTheme(darkThemeButton);
      removeActiveButtonTheme(systemThemeButton);

      if (theme === "light") {
        addActiveButtonTheme(lightThemeButton);
      } else if (theme === "dark") {
        addActiveButtonTheme(darkThemeButton);
      } else {
        addActiveButtonTheme(systemThemeButton);
      }
    }

    function animate() {
      const animateElements = document.querySelectorAll(".animate");

      animateElements.forEach((element, index) => {
        setTimeout(() => {
          element.classList.add("show");
        }, index * 100);
      });
    }

    function onScroll() {
      if (window.scrollY > 0) {
        document.documentElement.classList.add("scrolled");
      } else {
        document.documentElement.classList.remove("scrolled");
      }
    }

      window.scrollTo({

    function toggleTheme(dark) {
      const css = document.createElement("style");

      css.appendChild(

          `* {

             -moz-transition: none !important;
             -o-transition: none !important;
             -ms-transition: none !important;

          }
        `
        )
      );

      document.head.appendChild(css);

        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      window.getComputedStyle(css).opacity;
      document.head.removeChild(css);
    }

    function preloadTheme() {
      const userTheme = localStorage.theme;

    }

    backdrop?.classList.remove("visible");
    backdrop?.classList.add("invisible");
  }

  magnifyingGlass?.addEventListener("click", () => {
    openPagefind();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/") {
      e.preventDefault();
      openPagefind();
    } else if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      e.preventDefault();
      openPagefind();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closePagefind();
    }
  });

  document.addEventListener("click", (event) => {
    if (event.target.classList.contains("pagefind-ui__result-link")) {
      closePagefind();
    }
  });

  backdrop?.addEventListener("click", (event) => {
    if (!event.target.closest("#pagefind-container")) {
      closePagefind();
    }
  });

  const form = document.getElementById("form");
  form?.addEventListener("submit", (event) => {
    event.preventDefault();
  });

  function makeResultsClickable() {
    const results = document.querySelectorAll(".pagefind-ui__result");
    results.forEach((result) => {
      const link = result.querySelector(".pagefind-ui__result-link");
      const excerpt = result.querySelector(".pagefind-ui__result-excerpt");

      if (!excerpt || excerpt.dataset.clickable) return;

      if (link) {
        excerpt.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          link.click();
        });
        excerpt.dataset.clickable = "true";
      }
    });
  }

  function initObserver() {
    const searchContainer = document.getElementById("search");
    if (searchContainer) {
      const observer = new MutationObserver(makeResultsClickable);
      observer.observe(searchContainer, { childList: true, subtree: true });
    }
  }

  document.addEventListener("DOMContentLoaded", initObserver);
  document.addEventListener("astro:after-swap", initObserver);
